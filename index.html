<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategie</title>

  <link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #e4e7ec;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input,
    select,
    button {
      min-height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      padding: 0 12px;
      font: inherit;
    }

    input {
      min-width: 260px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      border-color: var(--accent);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(16, 24, 40, .04);
    }

    .stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }

    .stats strong {
      color: var(--text);
    }

    #tabella {
      border: 0;
    }

    .tabulator {
      border: 0;
      font-size: 14px;
    }

    .tabulator .tabulator-header {
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .tabulator-row {
      border-bottom: 1px solid #f0f2f5;
    }

    .status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #eef2ff;
    }

    .footer-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .container {
        padding: 14px;
      }

      input {
        min-width: 100%;
        width: 100%;
      }

      .controls {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Strategie</h1>
        <div class="subtitle" id="aggiornamento">Caricamento dati…</div>
      </div>

      <div class="controls">
        <input id="ricerca" type="search" placeholder="Cerca titolo, tipo, prezzo…">
        <select id="tipoFiltro">
          <option value="">Tutti i tipi</option>
        </select>
        <button id="resetFiltri">Azzera filtri</button>
        <button id="exportCsv">Esporta CSV</button>
      </div>
    </div>

    <div class="card">
      <div class="stats">
        <span>Strategie: <strong id="totale">0</strong></span>
        <span>Con acquisto: <strong id="conAcquisto">0</strong></span>
        <span>Con uscita 1: <strong id="conUscita">0</strong></span>
        <span>Con stop loss: <strong id="conStop">0</strong></span>
      </div>
      <div id="tabella"></div>
    </div>

    <div class="footer-note">
      Clicca sulle intestazioni per ordinare. I filtri sotto le intestazioni lavorano per singola colonna.
    </div>
  </div>

  <script>
    function formatDate(value) {
      if (!value) return "";
      const d = new Date(value);
      return new Intl.DateTimeFormat("it-IT", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "Europe/Rome"
      }).format(d);
    }

    function formatPrice(cell) {
      const value = cell.getValue();
      if (value === null || value === undefined || value === "") return "";
      return Number(value).toLocaleString("it-IT", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function dateFormatter(cell) {
      return formatDate(cell.getValue());
    }

    function dateSorter(a, b) {
      // Converti le stringhe ISO in timestamp per un ordinamento corretto
      const timeA = a ? new Date(a).getTime() : -Infinity;
      const timeB = b ? new Date(b).getTime() : -Infinity;
      return timeA - timeB;
    }

    function titoloLinkFormatter(cell) {
      const titolo = cell.getValue();
      if (titolo === null || titolo === undefined || titolo === "") return "";

      const safeTitolo = String(titolo);
      const url = "https://www.websim.it/azioni/screener-azioni/" + encodeURIComponent(safeTitolo);
      return `<a href="${url}" target="_blank" rel="noopener noreferrer">${safeTitolo}</a>`;
    }

    fetch("dati.json?v=" + Date.now(), {
      cache: "no-store"
    })
      .then(response => {
        if (!response.ok) throw new Error("Impossibile caricare dati.json");
        return response.json();
      })
      .then(json => {
        const strategie = Array.isArray(json.Strategie) ? json.Strategie : [];

        document.getElementById("totale").textContent = strategie.length;
        document.getElementById("conAcquisto").textContent =
          strategie.filter(x => x.BuyTimeStamp).length;
        document.getElementById("conUscita").textContent =
          strategie.filter(x => x.Uscita1TimeStamp).length;
        document.getElementById("conStop").textContent =
          strategie.filter(x => x.StopLossTimeStamp).length;

        document.getElementById("aggiornamento").textContent =
          json.TimeStamp ? "Dati aggiornati: " + formatDate(json.TimeStamp) : "";

        const tipi = [...new Set(strategie.map(x => x.Tipo).filter(Boolean))].sort();
        const select = document.getElementById("tipoFiltro");
        tipi.forEach(tipo => {
          const option = document.createElement("option");
          option.value = tipo;
          option.textContent = tipo;
          select.appendChild(option);
        });

        const table = new Tabulator("#tabella", {
          data: strategie,
          layout: "fitData",
          responsiveLayout: false,
          pagination: true,
          paginationSize: 20,
          paginationSizeSelector: [10, 20, 50, 100],
          movableColumns: true,
          placeholder: "Nessuna strategia trovata",
          initialSort: [
            { column: "ActiveFrom", dir: "desc" }
          ],
          columns: [
            { title: "Titolo", field: "Titolo", formatter: titoloLinkFormatter, headerFilter: "input", frozen: true, width: 100 },
            { title: "Tipo", field: "Tipo", headerFilter: "input", minWidth: 190 },
            { title: "Attiva dal", field: "ActiveFrom", formatter: dateFormatter, sorter: dateSorter, minWidth: 150 },
            { title: "Chiusa il", field: "Closed", formatter: dateFormatter, sorter: dateSorter, minWidth: 150 },
            { title: "Acquisto", field: "BuyTimeStamp", formatter: dateFormatter, sorter: dateSorter, minWidth: 150 },
            { title: "Prezzo acquisto", field: "BuyPrice", formatter: formatPrice, sorter: "number", hozAlign: "right", minWidth: 135 },
            { title: "Uscita 1", field: "Uscita1TimeStamp", formatter: dateFormatter, sorter: dateSorter, minWidth: 150 },
            { title: "Prezzo uscita 1", field: "Uscita1Price", formatter: formatPrice, sorter: "number", hozAlign: "right", minWidth: 135 },
            { title: "Uscita 2", field: "Uscita2TimeStamp", formatter: dateFormatter, sorter: dateSorter, minWidth: 150 },
            { title: "Prezzo uscita 2", field: "Uscita2Price", formatter: formatPrice, sorter: "number", hozAlign: "right", minWidth: 135 },
            { title: "Stop loss", field: "StopLossTimeStamp", formatter: dateFormatter, sorter: dateSorter, minWidth: 150 },
            { title: "Prezzo stop", field: "StopLossPrice", formatter: formatPrice, sorter: "number", hozAlign: "right", minWidth: 120 },
            { title: "Ultimo aggiornamento", field: "LastUpdate", formatter: dateFormatter, sorter: dateSorter, minWidth: 165 },
            { title: "ID", field: "Id", headerFilter: "input", minWidth: 280 }
          ]
        });

        const ricerca = document.getElementById("ricerca");

        function applicaFiltri() {
          const testo = ricerca.value.trim().toLowerCase();
          const tipo = select.value;

          table.setFilter(row => {
            const matchTipo = !tipo || row.Tipo === tipo;
            const haystack = Object.values(row)
              .filter(v => v !== null && v !== undefined)
              .join(" ")
              .toLowerCase();

            const matchTesto = !testo || haystack.includes(testo);
            return matchTipo && matchTesto;
          });
        }

        ricerca.addEventListener("input", applicaFiltri);
        select.addEventListener("change", applicaFiltri);

        document.getElementById("resetFiltri").addEventListener("click", () => {
          ricerca.value = "";
          select.value = "";
          table.clearHeaderFilter();
          table.clearFilter();
        });

        document.getElementById("exportCsv").addEventListener("click", () => {
          table.download("csv", "strategie.csv");
        });
      })
      .catch(error => {
        document.getElementById("aggiornamento").textContent = "Errore nel caricamento dei dati";
        document.getElementById("tabella").innerHTML =
          "<div style='padding:20px'>" + error.message + "</div>";
        console.error(error);
      });
  </script>
</body>

</html>
